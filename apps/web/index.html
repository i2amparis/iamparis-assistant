<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IAM PARIS · Data assistant</title>
    <link rel="icon" href="/brand/iam-paris-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Montserrat:wght@500..700&display=swap"
    />
    <!-- Before first paint, as on the IAMPARIS site (same storage key): saved theme, else the OS. -->
    <script>
      try {
        var stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
